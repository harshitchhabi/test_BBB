# Nginx reverse proxy for Bricks by Bid — bricksbybid.dreammerchantsevent.me
#
# certbot --nginx will rewrite this file in place to add the actual TLS
# `listen 443 ssl` block and a plain-HTTP -> HTTPS redirect once it runs
# (see deploy/README.md step "TLS"); the server_name/location blocks below
# are what it edits around. Don't hand-add TLS directives yourself first —
# let certbot do that part, it's designed to.
#
# Two upstreams, both bound to localhost only — neither Next.js (3000)
# nor the WebSocket relay (8080) is ever reachable directly from the
# internet, only through this proxy. This is also where the app's two
# "trust the reverse proxy" assumptions actually get satisfied:
#   - `proxy_set_header Host $host;` — requireParticipant()'s Origin/Host
#     CSRF check compares the request's Origin against its Host header;
#     without this, Next.js would see nginx's own upstream address as
#     Host instead of the real one, and every request would be rejected.
#   - `proxy_set_header X-Forwarded-For $remote_addr;` — deliberately
#     OVERWRITES rather than appends (nginx's common
#     $proxy_add_x_forwarded_for pattern appends nginx's view of the
#     client to whatever the client already sent, which means the FIRST
#     entry in the resulting header — the one login-limiter.ts reads —
#     would still be whatever an attacker put there. Using $remote_addr
#     alone discards any client-supplied value entirely, which is what
#     TRUST_PROXY_HEADERS=true (see deploy/env/frontend.env.example)
#     is actually trusting.
server {
    listen 80;
    listen [::]:80;
    server_name bricksbybid.dreammerchantsevent.me;

    # Frontend (Next.js) — everything except the WebSocket path below.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # WebSocket relay (backend/) — matches NEXT_PUBLIC_WS_URL=wss://<domain>/ws
    # in deploy/env/frontend.env.example. Needs the Upgrade/Connection
    # headers above's values and a long read timeout — this is a
    # long-lived connection, not a normal HTTP request/response.
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Optional: lets an external uptime monitor check the relay's timer
    # sweep (see backend/src/index.ts's /health) without SSH access.
    # Remove this block if you'd rather keep it SSH-only.
    location /relay-health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }
}
