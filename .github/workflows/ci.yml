name: CI

# Runs on every push and pull request against main - catches exactly the
# class of thing that used to only get caught by remembering to run
# `tsc --noEmit` and `npm test` by hand after every change: a broken
# build or a regressed game-engine test landing on main unnoticed.
#
# No Postgres service container is needed: packages/game-engine's test
# suite spins up a real embedded Postgres (PGlite, compiled to WASM) per
# test file - see packages/game-engine/tests/test-db.ts - so `npm test`
# is self-contained.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: frontend

      - name: Typecheck backend
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run game-engine test suite
        run: npm test
        working-directory: packages/game-engine
